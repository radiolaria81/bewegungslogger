name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests und APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: bewegungslogger-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Release mit APK anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk bewegungslogger-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" bewegungslogger-${{ github.run_number }}.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}"
