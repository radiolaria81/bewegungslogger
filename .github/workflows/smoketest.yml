name: Emulator-Test

on:
  push:
    branches: [smoketest]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Im Emulator starten
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./.github/smoketest.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-ergebnis
          path: out/
      - name: Ergebnis in Branch smoketest-results ablegen
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r out/* /tmp/res/ || true
          cd /tmp/res
          git init -q -b smoketest-results
          git config user.name ci; git config user.email ci@localhost
          git add -A && git commit -qm "Emulator-Ergebnis ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" smoketest-results
